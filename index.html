<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon-32x32.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--SEO_META-->
    <style>
      html body {
        background: #f8f8f8;
      }
      html[data-theme='dark'] body {
        background-color: #000;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }
      #loading-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 0.48;
      }
      #loading-brand img {
        display: block;
        /* Desaturated on purpose: this is a wait indicator, not a logo
           placement, and full-colour artwork at 40px reads as chrome the app
           is about to draw. AppShellSkeleton, which replaces this markup once
           React commits, drops the mark for the product wordmark — so expect a
           mark-to-name handoff here, not a like-for-like swap. */
        filter: grayscale(100%);
      }
    </style>
    <script>
      window.__LOBE_BOOT_T_HTML__ = performance.now();
    </script>
    <script>
      (function () {
        function supportsImportMaps() {
          return (
            typeof HTMLScriptElement !== 'undefined' &&
            typeof HTMLScriptElement.supports === 'function' &&
            HTMLScriptElement.supports('importmap')
          );
        }

        function supportsCascadeLayers() {
          var el = document.createElement('div');
          el.className = '__layer_test__';
          el.style.position = 'absolute';
          el.style.left = '-99999px';
          el.style.top = '-99999px';

          var style = document.createElement('style');
          style.textContent =
            '@layer a, b;' +
            '@layer a { .__layer_test__ { color: rgb(1, 2, 3); } }' +
            '@layer b { .__layer_test__ { color: rgb(4, 5, 6); } }';

          document.documentElement.append(style);
          document.documentElement.append(el);

          var color = getComputedStyle(el).color;

          el.remove();
          style.remove();

          return color === 'rgb(4, 5, 6)';
        }

        if (!(supportsImportMaps() && supportsCascadeLayers())) {
          window.location.href = '/not-compatible.html';
          return;
        }

        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }

        var hl = new URLSearchParams(location.search).get('hl');
        var m = document.cookie.match(/(?:^|;\s*)LOBE_LOCALE=([^;]*)/);
        var cookie = m ? decodeURIComponent(m[1]) : '';
        var locale = hl || cookie || navigator.language || 'en-US';
        if (locale === 'auto') locale = navigator.language || 'en-US';
        if (hl && !cookie) {
          document.cookie =
            'LOBE_LOCALE=' + encodeURIComponent(hl) + ';path=/;max-age=7776000;SameSite=Lax';
        }
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
    <script>
      window.__SERVER_CONFIG__ = undefined; /* SERVER_CONFIG */
    </script>
  </head>

  <body>
    <div id="loading-screen">
      <div id="loading-brand" aria-label="Loading" role="status">
        <!--
          Boot-time asset, not a component: this paints before any JS bundle
          runs, so it can't read the BRANDING_* constants (see
          packages/business/const/src/branding.ts) and has to hard-code a path
          under public/branding/ instead. scripts/sync-branding.mjs overlays
          that directory onto this submodule's public/ at build/dev time from
          the outer repo's branding/public/branding/, and the submodule
          gitignores it — so the customer's artwork is never committed here.

          The head-only crop, not BRANDING_LOGO_URL ("/branding/logo.png"):
          that one carries the full mascot including its labelled base, which
          at 40px collapses into noise.
        -->
        <img alt="" height="40" src="/branding/logo-head.png" />
      </div>
    </div>
    <div id="root" style="height: 100%"></div>

    <!--ANALYTICS_SCRIPTS-->
    <script type="module" src="/src/spa/entry.web.tsx"></script>
  </body>
</html>
