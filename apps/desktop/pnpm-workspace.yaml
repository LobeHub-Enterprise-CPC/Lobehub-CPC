packages:
  - '../cli'
  - '../../packages/agent-gateway-client'
  - '../../packages/agent-tracing'
  - '../../packages/chat-adapter-imessage'
  - '../../packages/heterogeneous-agents'
  - '../../packages/html-artifact'
  - '../../packages/const'
  - '../../packages/eval-rubric'
  - '../../packages/electron-server-ipc'
  - '../../packages/electron-client-ipc'
  - '../../packages/electron-mac-notifications'
  - '../../packages/electron-mac-permission-guide'
  - '../../packages/napi-loader'
  - '../../packages/file-loaders'
  - '../../packages/html-artifact'
  - '../../packages/desktop-bridge'
  - '../../packages/device-control'
  - '../../packages/device-sandbox'
  - '../../packages/device-gateway-client'
  - '../../packages/device-identity'
  - '../../packages/local-file-shell'
  - '../../packages/tool-runtime'
  - '../../packages/prompts'
  - '../../packages/ssrf-safe-fetch'
  - '../../packages/business/const'
  - '../../packages/types'
  - '../../packages/model-bank'
  - '../../packages/utils'
  - '.'

lockfile: true
shamefullyHoist: true
ignoreWorkspaceRootCheck: true

publicHoistPattern:
  - '*@umijs/lint*'
  - '*unicorn*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
  - '@auth/core'
  - 'pdfjs-dist'

allowBuilds:
  '@sentry/cli': true
  electron: true
  electron-builder: true
  electron-sparkle-updater: false
  electron-winstaller: false
  esbuild: false
  get-windows: false
  node-mac-permissions: true
  protobufjs: false

overrides:
  # Keep every importer on the Market SDK version the root workspace pins, as the
  # root pnpm-workspace.yaml does.
  '@lobehub/market-sdk': 0.47.0
  '@lobehub/market-types': 1.23.0
  node-gyp: ^12.4.0
  react: 19.2.7
  react-dom: 19.2.7
  vitest: 5.0.3
  'zod@^4': 4.6.5
minimumReleaseAgeExclude:
  - electron-sparkle-updater@0.5.3
  - '@lobehub/*'
